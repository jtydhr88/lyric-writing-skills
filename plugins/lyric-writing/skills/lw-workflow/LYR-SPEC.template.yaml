# LYR-SPEC 空模板 —— 复制这份开始写
#
# 规范见 LYR-SPEC.schema.md；填好的例子见 example-01-jacket.yaml（正）／example-00-ai-default.yaml（反）
#
# ★ 唯一的硬门禁：intent 五项不填齐，不许写第一句词。
#
# 写完：按 lw-workflow §5.2 的十条逐条自查；中文词按 lw-tone-check §2.3 手判倒字。

spec_version: "1.0"

meta:
  title: ""
  language:                  # 普通话 / 粤语 / 英文 / 日文 / 韩文  ★ 决定读哪个 L2 skill
  flow:                      # 先曲后词 / 先词后曲  ★ 本库第一个岔路口，两条路阶段表不同
  style_layer: none          # L3 skill id，如 lw-chinese-style
  tempo:                     # ○ 共享字段（schema §3.3）。先词后曲／只有词这一侧时本库定，定不出写 null 并发消息；先曲后词留空
  key:                       # ○ 同上
  upstream:                  # ○ 有就读，没有就按本库自己的分析走（schema §3.2）。先曲后词时共享字段在这里，当锁死项用
    form: []                 #   段落表 [{id, name, bars, energy}]
    tempo:
    key:
    vocal_persona: ""        #   谁在唱
    melody: ""               #   旋律出处：demo／谱／MIDI；没有写 none
    brief: ""                #   委托的要求；没有写 none
    scene: ""                #   这首歌在戏或画面里的位置；不在戏里写 none

# ════════════════════════════════════════════════════════════
# ★ 门禁：四项缺一不许往下写
# ════════════════════════════════════════════════════════════
intent:
  plot_type: ""              # ★ 先答。attitudinal / situational / narrative / expository 四选一。默认不是 narrative
  one_thing: ""              # ★ 一句话。念出来要像人话，不是主题词。不许"既…又…"
  to_whom: ""                # ★ 一个能想象出脸的对象。"抒情"和"听众"不算
  at_what_moment: ""         # ★ 时间点，不是时间段
  anchor_object: ""          # ★ 能拍照。判据：说得出它的颜色、大小、新旧
  anchor_phrase: ""          # ★ 态度型／说理型可以用一句话当锚（请求／决定／质问／宣言，副歌反复它），此时 anchor_object 写「无」

# ════════════════════════════════════════════════════════════
# 词与旋律的咬合
#   先曲后词 → 照 meta.upstream 的段落表与旋律量出来
#   先词后曲 → 这里是产出，连同下面的 form 一起交出去，约束小节数
# ════════════════════════════════════════════════════════════
prosody:
  sections:
    - id:                    # ★ 段落 id，与 form[].id 一一对应
      syllables: []          # ★ 词写完之后逐行数出来填，不要先填再写词。只数汉字，标点不算，整行括号的 ad-lib 不算。一个元素 = lyrics 里的一行
      stress_positions:      # 英文：重音位置；中文：旋律强拍落在第几字
      peak_syllable: ""      # ★ 全段最高音落在哪个字——这个字必须经得起唱
      melody_contour: ""     # 先曲后词：量到的旋律走向；先词后曲：词对旋律走向的要求（字调轮廓）
      notes: []              # ○ MIDI 音高，与字数严格相等。给 倒字判定 用

# ════════════════════════════════════════════════════════════
# 与歌曲另一侧共享的字段（schema §3.3）：谁先做谁定，后做的一方只读，想改发消息
#   先词后曲／只有词这一侧 → 本库在这里定（连同 meta.tempo、meta.key）
#   先曲后词 → 留空，读 meta.upstream
# ════════════════════════════════════════════════════════════
form: []                     # [{id, name, bars}]；id 与 prosody.sections[].id、lyrics[].section 相同
vocal:
  persona: ""                # 谁在唱：性别、年纪、人设；与 narrative.pov 一致

rhyme:
  scheme: ""                 # 如 AABA
  che: []                    # 辙口（十三辙 / 粤语韵部）。★ 不许全曲只用一两个宽辙
  deliberate_breaks: []      # ★ 哪几处故意不押 —— 全押到底是 AI 味。空数组视为未填
  surprise_notes: ""         # 哪个韵脚"意外又觉得对"

imagery:
  concrete_nouns: []         # ★ 能拍照的物件清单
  system: ""                 # ★ 这些物件构成什么系统 —— 不是随机堆意象
  forbidden: []              # ★ 本首禁用的抽象词。lint 查它们在词里零出现
                             #   （另有 25 个基线词同样查零出现：时光/岁月/远方/梦想/自由/青春/思念/温柔/勇气/
                             #    回忆/距离/孤独/永远/命运/星辰/海洋/天空/翅膀/光芒/希望/believe/dream/forever/destiny/soul）

narrative:
  pov: ""                    # 人称与视角
  tense_anchor: ""           # 时间锚点。★ 由 intent.at_what_moment 决定
  withholding: ""            # ★ 该说的地方不说的那一处在哪
                             #   AI 会把情绪走完整，真人经常停在难受里

# ════════════════════════════════════════════════════════════
# ★ 刻意的不对称 —— 三项至少填两项，且每项说得出理由
# ════════════════════════════════════════════════════════════
asymmetry:
  short_line: ""             # 哪一行故意短
  unrhymed: ""               # 哪一段故意不押
  chorus_variation: ""       # 末遍副歌改了哪一到三个字，落在段首或段尾。前两遍相同是常态
  repetition_budget: ""      # ★ 副歌重复几遍、主歌靠什么推进（新事件 / 再看一眼 / 拉远镜头）。见 lw-structure §6.0

# ════════════════════════════════════════════════════════════
# 词本身
#   ★ 分行不是排版，是指令 —— 唱的人把换行当乐句边界读
#   ★★ 词里不许有任何注释/创作说明 —— 照着词唱的人会把它唱出来
# ════════════════════════════════════════════════════════════
lyrics:
  - section:
    lines:
      - ""

checks:
  computed: {}               # 手判后填：daozi_rate / xieyin_violations …
  self_audit:
    - "[ ] one_thing 念出来是一句人话，不是主题词"
    - "[ ] anchor_object 说得出颜色、大小、新旧"
    - "[ ] 去掉标题和专名，别人能说出这首歌讲的是哪一件具体的事"
    - "[ ] 每一处不对称说得出理由"
    - "[ ] 中文：倒字高风险处实际唱/念过，确认无误"
  exemptions: []             # ★ 豁免必须写理由，不许静默跳过

# ════════════════════════════════════════════════════════════
# 消息通道（schema §3.4）：公共区，任何一方都可以写；本库写 from: lyrics
#   例：- {from: lyrics, to: music, about: "form[C2].bars", says: "C2 第 3 句放不进 4 小节，请改成 6 小节", status: open}
#   from／to：lyrics music sound writing production；status：open answered accepted rejected
#   读不到回话就当没有，本库不等待；写给本库的（to: lyrics）开工时与每次改词前读
# ════════════════════════════════════════════════════════════
messages: []
