rhyme:
  scheme: AABA ／ 副歌换辙
  che:
  - 中东
  - 言前
  - 一七
  deliberate_breaks:
  - C1 第 3 句不押——那一句是全曲唯一一处直说，押上去会像顺口溜
  - D 段整段不押——鼓贝已撤，押韵会把它拉回歌里
  surprise_notes: C1 末句用『还』收——它既是『归还』也是『还有』，两个意思都成立
imagery:
  concrete_nouns:
  - 藏青色连帽卫衣
  - 左袖口的球
  - 松掉的领子
  - 洗衣机玻璃门
  - 脱水时的嗡鸣
  - 阳台的晾衣杆
  - 他留下的那半瓶洗衣液
  - 楼下便利店的灯
  system: 全部是**这一次洗衣服能看见/听见/摸到的东西**——摄影机不离开这间屋子。时间跨度靠物件的新旧带（起球=穿了很久，半瓶洗衣液=他走时没拿）
  forbidden:
  - 时光
  - 岁月
  - 回忆
  - 思念
  - 温柔
  - 远方
  - 青春
  - 孤独
  - 永远
narrative:
  pov: 第一人称，但**从不说『我想你』**——只说我在做什么、看见什么
  tense_anchor: 现在时。整首歌发生在一次洗衣的时间里（约 40 分钟），插叙只靠物件
  withholding: ★ 全曲不说明他为什么搬走、也不说我想不想他。C1 第 3 句『该还了』说到一半就断，后面接的是洗衣机的声音
asymmetry:
  short_line: C1／C2 末句只有 6 字（前三句 9/9/11），短得突兀——让『该还了』砸下来
  unrhymed: D 段整段不押（见 rhyme.deliberate_breaks）
  chorus_variation: C1『该还了』／C2『早该还了』／C3『不还了』——★ 三个字的位置不动，意思翻转
lyrics:
- section: A1
  lines:
  - 洗衣机转到第三圈的时候
  - 我隔着玻璃看见那个袖口
  - 左边那块起了球
  - 两年前你说这件穿着有点小了
- section: B1
  lines:
  - 阳台的灯比楼下的亮
  - 晾衣杆上还空着一格
  - 洗衣液剩了半瓶我一直没换牌子
- section: C1
  lines:
  - 藏青色的领子已经松了
  - 我知道这件衣服该还了
  - 可是你连地址都换过三次
  - 该还了
- section: A2
  lines:
  - 脱水的声音大得像在催我
  - 那半瓶还剩一半
  - 你走那天洗衣机也在转我没听见
- section: C2
  lines:
  - 藏青色的领子已经松了
  - 我知道这件衣服早该还了
  - 可是你连地址都换过三次
  - 早该还了
- section: D
  lines:
  - 现在它干净了
  - 味道也没了
  - 晾衣杆上那一格我挂满了
- section: C3
  lines:
  - 藏青色的领子已经松了
  - 我知道这件衣服不还了
  - 可是你连地址都换过三次
  - 那就不还了吧
