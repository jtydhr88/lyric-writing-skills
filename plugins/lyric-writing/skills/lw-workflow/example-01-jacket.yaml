    - '[Chorus]'
    - '[Verse]'
    - '[Chorus]'
    - '[Bridge]'
    - '[Chorus]'
    format_notes: 分行即乐句边界；C1/C2/C3 末句独立成行，前面要有停顿
checks:
  computed:
    daozi_rate: 0.0482
  self_audit:
  - '[x] one_thing 念出来是一句人话'
  - '[x] anchor_object 说得出颜色（藏青）、大小（他嫌小）、新旧（起球、领松）'
  - '[ ] 去掉标题和专名，别人能说出这首歌讲的是哪一件具体的事 —— 待找人试'
  - '[x] 每一处不对称说得出理由（见 asymmetry 各项）'
  - '[ ] 倒字高风险处实际唱过 —— 待旋律定稿'
  exemptions: []
